<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>User Management</title>
    <style>
        .title {
            text-align: center;
        }

        .user-table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }

        .user-table th, .user-table td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        .user-table th {
            background-color: #f0f0f0;
            font-weight: bold;
        }

        .user-table tr:nth-child(even) {
            background-color: #f8f8f8;
        }

        .user-table a {
            color: #4CAF50;
            text-decoration: none;
        }

        .user-table a:hover {
            text-decoration: underline;
        }

        .action-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 3px;
            margin: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .action-button:hover {
            background-color: #4CAF50;
        }

        .main-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }

        .main-nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .main-nav li {
            display: inline;
            margin: 0 10px;
        }

        .main-nav a {
            color: #fff;
            text-decoration: none;
            padding: 15px 32px;
        }

        .main-nav a:hover {
            background-color: #000000;
        }

        .active {
            background-color: #000000;
        }

        .logout-button {
            background-color: transparent;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
        }

        .logout-button:hover {
            background-color: #000000;
            cursor: pointer;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #F2F2F2;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            font-size: 16px;
        }

        header {
            background: #333;
            color: #ffffff;
            padding: 15px 10px;
            text-align: center;
        }
    </style>
</head>
<body>
<header>
    <nav class="main-nav">
        <ul>
            <li><a th:href="@{/home}">Home</a></li>
            <li><a th:href="@{/tasks}">My Tasks</a></li>
            <li><a th:href="@{/profile}">Profile</a></li>
            <li><a class="active" sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/users}">Users</a></li>
        </ul>
        <ul>
            <li>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button class="logout-button" type="submit">Logout</button>
                </form>
            </li>
        </ul>
    </nav>
</header>
<h1 class="title">User Management</h1>
<div>
    <a th:href="@{/users/add}">
        <button class="action-button">Add User</button>
    </a>
</div>
<table class="user-table">
    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.active ? 'Active' : 'Inactive'}"></td>
        <td>
            <!-- <a th:href="@{'/profile/' + ${user.id}}">
                <button class="action-button">Edit</button>
            </a> -->
            <form th:if="${user.active}" th:action="@{users/deactivate}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="user_id" th:value="${user.id}"/>
                <button type="submit" class="action-button"
                        onclick="return confirm('Are you sure you want to deactivate this user?')">
                    Deactivate
                </button>
            </form>
            <form th:unless="${user.active}" th:action="@{users/activate}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="user_id" th:value="${user.id}"/>
                <button type="submit" class="action-button"
                        onclick="return confirm('Are you sure you want to activate this user?')">
                    Activate
                </button>
            </form>
            <form th:action="@{users/delete}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="user_id" th:value="${user.id}"/>
                <button class="action-button" type="submit"
                        onclick="return confirm('Are you sure to delete this user?')">Delete
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<script>
</script>
</body>
</html>
